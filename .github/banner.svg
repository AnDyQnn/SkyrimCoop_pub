  </defs>
  <rect width="900" height="240" rx="14" fill="url(#bg)"/>
  <text x="450" y="84" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="url(#title)">SkyrimCoop</text>
  <text x="450" y="118" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e">C++ модуль · Python-сервер · один мир на всех</text>
  <path d="M230 176 H670" stroke="#30363d" stroke-width="3"/>
